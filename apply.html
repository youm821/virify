<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications</title>
<style>
  :root { --bg:#0d0f14; --card:#14171e; --text:#e9ebf1; --muted:#8a93a6; --line:#232834; --accent:#7c6cff; --good:#3ddc97; --bad:#f2555d; --warn:#f5a524; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 56px; }
  a { color:var(--accent); text-decoration:none; font-size:14px; }
  h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:15px; margin:0 0 12px; } p { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { resize:vertical; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; margin-top:14px; }
  button.good { border-color:var(--good); color:var(--good); } button.bad { border-color:var(--bad); color:var(--bad); }
  .msg { margin-top:10px; font-size:14px; } .err { color:var(--bad); } .ok { color:var(--good); }
  .item { padding:12px 0; border-bottom:1px solid var(--line); } .item:last-child { border:0; }
  .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .muted { color:var(--muted); } .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .tag { font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); }
  .pending { color:var(--warn); } .approved { color:var(--good); } .denied { color:var(--bad); }
  .body { white-space:pre-wrap; margin-top:6px; font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/">← Back to dashboard</a>
  <h1>Applications</h1>
  <p>Apply to a department. Staff review applications and you’ll see the result here.</p>

  <div class="card">
    <h2>New application</h2>
    <label for="dept">Department</label><select id="dept"></select>
    <label for="rbx">Roblox username</label><input id="rbx" type="text" maxlength="20">
    <label for="exp">Relevant experience (optional)</label><textarea id="exp" rows="3" maxlength="600"></textarea>
    <label for="why">Why do you want to join?</label><textarea id="why" rows="4" maxlength="600"></textarea>
    <button class="primary" id="send">Submit application</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card"><h2>Your applications</h2><div id="mine" class="muted">Loading…</div></div>

  <div class="card" id="review" hidden><h2>Review queue <span class="muted" style="font-weight:400">(staff)</span></h2><div id="queue" class="muted">Loading…</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const el = (t, text, c) => { const e = document.createElement(t); if (text !== undefined) e.textContent = text; if (c) e.className = c; return e; };
const J = { 'Content-Type': 'application/json' };
const when = ms => new Date(ms).toLocaleString();

async function load() {
  const r = await fetch('/api/apply/me');
  if (r.status === 401) { location.href = '/login'; return; }
  const d = await r.json();
  if (!$('dept').options.length) for (const x of d.departments) $('dept').append(new Option(x, x));
  const mine = $('mine'); mine.textContent = '';
  if (!d.mine.length) mine.textContent = 'You haven’t applied yet.';
  for (const a of d.mine) {
    const it = el('div', undefined, 'item'), top = el('div', undefined, 'top');
    top.append(el('strong', `${a.department} · ${a.roblox}`), el('span', a.status, 'tag ' + a.status));
    it.append(top, el('div', when(a.at), 'muted'));
    if (a.note) it.append(el('div', `Staff note: ${a.note}`, 'body'));
    mine.append(it);
  }
  $('review').hidden = !d.staff;
  if (d.staff) loadQueue();
}

async function loadQueue() {
  const r = await fetch('/api/staff/apps');
  if (!r.ok) return;
  const list = await r.json(), box = $('queue'); box.textContent = '';
  if (!list.length) box.textContent = 'No applications yet.';
  for (const a of list) {
    const it = el('div', undefined, 'item'), top = el('div', undefined, 'top');
    top.append(el('strong', `${a.userName} · ${a.department} · ${a.roblox}`), el('span', a.status, 'tag ' + a.status));
    it.append(top, el('div', when(a.at), 'muted'));
    if (a.experience) it.append(el('div', 'Experience: ' + a.experience, 'body'));
    it.append(el('div', 'Why: ' + a.why, 'body'));
    if (a.status === 'pending') {
      const note = el('input'); note.type = 'text'; note.maxLength = 200; note.placeholder = 'Note for the applicant (optional)'; note.style.marginTop = '8px';
      const row = el('div', undefined, 'row'), msg = el('div', '', 'msg err');
      for (const [decision, label, cls] of [['approved', 'Approve', 'good'], ['denied', 'Deny', 'bad']]) {
        const b = el('button', label, cls);
        b.onclick = async () => {
          b.disabled = true;
          const r2 = await fetch('/api/staff/apps/' + a.id, { method: 'POST', headers: J, body: JSON.stringify({ decision, note: note.value }) });
          if (r2.ok) load(); else { b.disabled = false; msg.textContent = (await r2.json()).error || 'Could not save.'; }
        };
        row.append(b);
      }
      it.append(note, row, msg);
    } else if (a.note) it.append(el('div', 'Note: ' + a.note, 'body'));
    box.append(it);
  }
}

$('send').onclick = async () => {
  const msg = $('msg'), b = $('send'); b.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
  try {
    const r = await fetch('/api/apply', { method: 'POST', headers: J,
      body: JSON.stringify({ department: $('dept').value, roblox: $('rbx').value, experience: $('exp').value, why: $('why').value }) });
    const d = await r.json();
    if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Submitted! Staff will review it.'; $('exp').value = ''; $('why').value = ''; load(); }
    else { msg.className = 'msg err'; msg.textContent = d.error || 'Something went wrong.'; }
  } catch { msg.className = 'msg err'; msg.textContent = 'Can’t reach the server.'; }
  b.disabled = false;
};
load();
</script>
</body>
</html>
