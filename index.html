<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERLC Live Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #14161a; --muted: #5d6573;
    --line: #e1e4ea; --accent: #2563eb; --accent-soft: rgba(37,99,235,.12);
    --good: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171b22; --text: #e8eaee; --muted: #98a1b0;
      --line: #262c36; --accent: #5b8def; --accent-soft: rgba(91,141,239,.18);
      --good: #34d17a; --warn: #f0a23b; --bad: #f26b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 56px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
          display: grid; place-items: center; font-weight: 700; font-size: 18px; overflow: hidden; flex: none; border: 1px solid var(--line); }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 22px; margin: 0; overflow-wrap: anywhere; }
  .live { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.off { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; border: 1px solid; }
  .banner.warn { background: rgba(217,119,6,.14); color: var(--warn); border-color: var(--warn); }
  .banner.bad { background: rgba(220,38,38,.14); color: var(--bad); border-color: var(--bad); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 28px; font-weight: 650; margin-top: 2px; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-bottom: 16px; }
  .section { margin-bottom: 16px; }
  .bar-row { margin-bottom: 10px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .chip { display: inline-block; padding: 2px 8px; margin: 0 6px 6px 0; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .badge.bad { background: rgba(220,38,38,.14); color: var(--bad); }
  input[type=text], input[type=password], select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--bg); color: var(--text); font: inherit; }
  input[type=text], input[type=password] { width: 100%; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters input { flex: 1 1 200px; width: auto; }
  .table-wrap { overflow-x: auto; max-height: 360px; overflow-y: auto; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--card); }
  .muted { color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  button.active, button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); }
  .row { display: flex; gap: 8px; }
  .call { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .call:last-child { border-bottom: 0; }
  .call .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 6px; }
  .chart-box { width: 100%; }
  .chart-box svg { width: 100%; height: 150px; display: block; }
  .chart-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; flex-wrap: wrap; gap: 6px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  a.btn { display: inline-block; padding: 7px 12px; border-radius: 8px; background: var(--accent); color: var(--on-accent, #fff); text-decoration: none; font-size: 14px; }
  a.link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--line); }
  .code { font: 600 20px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 8px; display: inline-block; margin: 8px 0; user-select: all; }
  .msg { margin-top: 8px; font-size: 14px; } .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
  .lists { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .lists h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .lists ol { margin: 0; padding-left: 20px; font-size: 14px; } .lists li span { color: var(--muted); }
  textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  [hidden] { display: none !important; }

  /* manual theme override (the toggle button sets data-theme on <html>) */
  :root[data-theme="dark"] { --bg: #0e1116; --card: #171b22; --text: #e8eaee; --muted: #98a1b0; --line: #262c36; --accent: #5b8def; --accent-soft: rgba(91,141,239,.18); --good: #34d17a; --warn: #f0a23b; --bad: #f26b6b; }
  :root[data-theme="light"] { --bg: #f4f5f7; --card: #ffffff; --text: #14161a; --muted: #5d6573; --line: #e1e4ea; --accent: #2563eb; --accent-soft: rgba(37,99,235,.12); --good: #16a34a; --warn: #d97706; --bad: #dc2626; }
  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 60px; }
  .nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 16px; padding: 8px 16px;
         background: var(--bg); border-bottom: 1px solid var(--line); }
  .nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .nav a:hover { background: var(--accent-soft); color: var(--accent); }
  .call.police { border-left: 3px solid #3b82f6; padding-left: 10px; }
  .call.fire { border-left: 3px solid #ef4444; padding-left: 10px; }
  .call.ems { border-left: 3px solid #22c55e; padding-left: 10px; }
  .call.alert .warnline { color: var(--bad); font-weight: 600; font-size: 13px; }
  th[data-sort] { cursor: pointer; user-select: none; }
  th.asc::after { content: " ▲"; font-size: 10px; } th.desc::after { content: " ▼"; font-size: 10px; }
  .heat { display: grid; grid-template-columns: 34px repeat(24, minmax(10px, 1fr)); gap: 2px; min-width: 420px; }
  .heat .c { aspect-ratio: 1; min-height: 10px; background: var(--accent); border-radius: 3px; }
  .heat .hl, .heat .dl { font-size: 10px; color: var(--muted); line-height: 1.6; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar input { flex: 1 1 180px; width: auto; }
  .tabs.small { margin-bottom: 8px; }
  .tabs.small button { padding: 3px 10px; font-size: 13px; }

  /* ---- Theme picker ---- */
  .tpanel { position: fixed; top: 64px; right: 16px; z-index: 30; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 90px);
            overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
            box-shadow: 0 18px 40px -16px rgba(0,0,0,.45); }
  .tpanel h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 500; }
  .tgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .topt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; text-align: left; font-size: 13px; }
  .topt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tprev { width: 36px; height: 26px; border-radius: 6px; border: 1px solid rgba(128,128,128,.45); flex: none; position: relative; overflow: hidden; }
  .tprev i { position: absolute; left: 4px; right: 4px; bottom: 3px; height: 11px; border-radius: 3px; }
  .tprev b { position: absolute; left: 4px; top: 3px; width: 15px; height: 5px; border-radius: 3px; }
  .tfields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tfield { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .tfield input[type=color] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }

  /* ---- Live map ---- */
  .mapbox { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .mapbox svg { display: block; width: 100%; height: auto; max-height: 640px; margin: 0 auto; }
  .map-dot { cursor: pointer; stroke: var(--card); stroke-width: 2; }
  .map-dot.wanted { stroke: var(--bad); stroke-width: 4; }
  .map-label { font-size: 14px; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
  .map-legend { margin-top: 10px; }
  .maptools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .maptools label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

  /* ---- Loading skeletons (replace the old "Loading…" text) ---- */
  @keyframes shimmer { to { background-position: -200% 0; } }
  .skel, .sk {
    background: linear-gradient(90deg, var(--line) 25%, var(--accent-soft) 50%, var(--line) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 6px;
  }
  .skel { height: 14px; margin: 9px 0; }
  .skel.short { width: 60%; }
  .stat .value.sk { color: transparent; width: 72px; height: 34px; }
  @media (prefers-reduced-motion: reduce) { .skel, .sk { animation: none; } }

  /* ---- Tables turn into cards on small screens ---- */
  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 48px; }
    .table-wrap { overflow-x: visible; max-height: 480px; }
    table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
    table.cards thead { display: none; }
    table.cards tr { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; background: var(--bg); }
    table.cards td { display: flex; justify-content: space-between; gap: 14px; border: 0; padding: 4px 0;
                     white-space: normal; text-align: right; overflow-wrap: anywhere; }
    table.cards td::before { content: attr(data-label); color: var(--muted); text-align: left; flex: none; }
    table.cards td[data-label=""]::before { display: none; }
    .two { grid-template-columns: 1fr; }
  }
</style>
<script>
// ---------- Themes (applied early so the page doesn't flash the wrong colors) ----------
const THEME_VARS = { bg: '--bg', card: '--card', text: '--text', muted: '--muted', line: '--line', accent: '--accent',
  accentSoft: '--accent-soft', good: '--good', warn: '--warn', bad: '--bad', onAccent: '--on-accent' };
const THEMES = {
  light:    { name: 'Light',    dark: false, v: { bg: '#f4f5f7', card: '#ffffff', text: '#14161a', muted: '#5d6573', line: '#e1e4ea', accent: '#2563eb', accentSoft: 'rgba(37,99,235,.12)', good: '#16a34a', warn: '#d97706', bad: '#dc2626', onAccent: '#ffffff' } },
  dark:     { name: 'Dark',     dark: true,  v: { bg: '#0e1116', card: '#171b22', text: '#e8eaee', muted: '#98a1b0', line: '#262c36', accent: '#5b8def', accentSoft: 'rgba(91,141,239,.18)', good: '#34d17a', warn: '#f0a23b', bad: '#f26b6b', onAccent: '#ffffff' } },
  midnight: { name: 'Midnight', dark: true,  v: { bg: '#0b0d17', card: '#131629', text: '#e6e8f5', muted: '#8f95b8', line: '#232844', accent: '#7c83ff', accentSoft: 'rgba(124,131,255,.18)', good: '#34d17a', warn: '#f0a23b', bad: '#f26b6b', onAccent: '#ffffff' } },
  ocean:    { name: 'Ocean',    dark: false, v: { bg: '#eef6f8', card: '#ffffff', text: '#0f2a33', muted: '#53727c', line: '#d5e6ea', accent: '#0e7490', accentSoft: 'rgba(14,116,144,.12)', good: '#16a34a', warn: '#d97706', bad: '#dc2626', onAccent: '#ffffff' } },
  forest:   { name: 'Forest',   dark: true,  v: { bg: '#0d1511', card: '#15201a', text: '#e4efe8', muted: '#8fa899', line: '#24352b', accent: '#34b27b', accentSoft: 'rgba(52,178,123,.18)', good: '#34d17a', warn: '#f0a23b', bad: '#f26b6b', onAccent: '#04150b' } },
  sunset:   { name: 'Sunset',   dark: true,  v: { bg: '#17100f', card: '#211716', text: '#f5e9e6', muted: '#b39a95', line: '#38262a', accent: '#f97316', accentSoft: 'rgba(249,115,22,.18)', good: '#34d17a', warn: '#f0a23b', bad: '#f26b6b', onAccent: '#1a0a02' } },
  rose:     { name: 'Rose',     dark: false, v: { bg: '#fdf2f5', card: '#ffffff', text: '#2a1219', muted: '#7c5560', line: '#f3d5dd', accent: '#e11d48', accentSoft: 'rgba(225,29,72,.12)', good: '#16a34a', warn: '#d97706', bad: '#b91c1c', onAccent: '#ffffff' } },
  contrast: { name: 'High contrast', dark: true, v: { bg: '#000000', card: '#0a0a0a', text: '#ffffff', muted: '#c4c4c4', line: '#555555', accent: '#ffd60a', accentSoft: 'rgba(255,214,10,.2)', good: '#4ade80', warn: '#fbbf24', bad: '#ff6b6b', onAccent: '#000000' } },
};
const THEME_DEFAULT_CUSTOM = { accent: '#8b5cf6', bg: '#12101a', card: '#1b1826', text: '#ece9f5' };
const themeRgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
function themeLum(hex) {
  const [r, g, b] = themeRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function themeMix(a, b, t) { const x = themeRgb(a), y = themeRgb(b); return '#' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, '0')).join(''); }
function themeRgba(hex, a) { const [r, g, b] = themeRgb(hex); return `rgba(${r},${g},${b},${a})`; }
// Builds a full theme from the four colors a person picks.
function themeDerive(c) {
  const d = THEME_DEFAULT_CUSTOM, ok = k => (c && /^#[0-9a-f]{6}$/i.test(c[k])) ? c[k] : d[k];
  const accent = ok('accent'), bg = ok('bg'), card = ok('card'), text = ok('text');
  const dark = themeLum(bg) < 0.25;
  return { name: 'Custom', dark, v: {
    bg, card, text, accent,
    muted: themeMix(text, bg, 0.4), line: themeMix(bg, text, 0.14), accentSoft: themeRgba(accent, dark ? 0.2 : 0.12),
    good: dark ? '#34d17a' : '#16a34a', warn: dark ? '#f0a23b' : '#d97706', bad: dark ? '#f26b6b' : '#dc2626',
    onAccent: themeLum(accent) > 0.45 ? '#111111' : '#ffffff',
  } };
}
function themeApply(id, custom) {
  const root = document.documentElement;
  for (const css of Object.values(THEME_VARS)) root.style.removeProperty(css);
  const t = id === 'custom' ? themeDerive(custom) : THEMES[id];
  if (!t) { delete root.dataset.theme; root.style.colorScheme = ''; return; }   // "Auto": follow the device
  root.dataset.theme = id;
  for (const [k, css] of Object.entries(THEME_VARS)) root.style.setProperty(css, t.v[k]);
  root.style.colorScheme = t.dark ? 'dark' : 'light';
}
let themeId = '', themeCustom = null;
try { themeId = localStorage.getItem('theme') || ''; themeCustom = JSON.parse(localStorage.getItem('themeCustom') || 'null'); } catch {}
themeApply(themeId, themeCustom);
</script>

<!-- PASTE THIS WHOLE BLOCK just above </body> at the very bottom of index.html.
     If you already pasted polish.html or tabs.html, DELETE those two blocks first; this one replaces both. -->
<style id="sidebar-css">
:root {
  --side: 232px;
  --bg: #0d0f14; --card: #14171e; --text: #e9ebf1; --muted: #8a93a6; --line: #232834;
  --accent: #7c6cff; --accent-soft: rgba(124,108,255,.14); --on-accent: #ffffff;
  --good: #3ddc97; --warn: #f5a524; --bad: #f2555d;
}
body { background: var(--bg); }
.wrap { max-width: none; padding: 0 28px 40px calc(var(--side) + 28px); }
.wrap > header, .wrap > .banner, .wrap > .tabpanel { max-width: 1200px; }

/* top bar: status, account, theme */
header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 0; margin: 0 0 8px; border: 0; justify-content: flex-end; }

/* left sidebar */
.nav {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--side); z-index: 20; margin: 0; padding: 18px 12px;
  flex-direction: column; gap: 2px; overflow-y: auto; background: var(--card); border: 0; border-right: 1px solid var(--line);
}
.nav .brand { padding: 4px 8px 18px; }
.nav .brand h1 { font-size: 16px; font-weight: 700; }
.nav .side-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 0; border: 0; border-radius: 8px; color: var(--muted); font-size: 14px; }
.nav a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: var(--accent-soft); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--text); }
.nav a.on svg { color: var(--accent); }

/* cards and text */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: none; }
.section, .grid, .two { margin-bottom: 14px; }
.two, .grid { gap: 14px; }
h2 { font-size: 15px; font-weight: 600; color: var(--text); padding: 0; margin-bottom: 14px; border: 0; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stat:hover { transform: none; box-shadow: none; border-color: var(--line); }

/* controls */
button, input, select, textarea, a.btn { border-radius: 8px; }
input, select, textarea { background: var(--bg); }
button { background: var(--bg); }
button:hover { border-color: var(--accent); }
button.primary, button.active, a.btn { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* tables */
th { font-size: 12px; font-weight: 500; }
th, td { padding: 10px 12px; }
tbody tr:hover { background: var(--accent-soft); }
.mapbox { border-radius: 10px; }

/* phone: sidebar becomes a bottom tab bar */
@media (max-width: 860px) {
  .nav { top: auto; width: auto; right: 0; height: 60px; flex-direction: row; padding: 6px 8px; overflow: visible; border-right: 0; border-top: 1px solid var(--line); }
  .nav .brand, .nav .side-label { display: none; }
  .nav a { flex: 1; flex-direction: column; justify-content: center; gap: 3px; font-size: 11px; padding: 6px 4px; }
  .wrap { padding: 0 14px 84px; }
  header { justify-content: space-between; }
}
</style>
<script id="sidebar-js">
(() => {
  const wrap = document.querySelector('.wrap');
  const nav = wrap && wrap.querySelector('.nav');
  if (!wrap || !nav) return;
  const q = id => document.getElementById(id);
  const up = (id, sel) => { const e = q(id); return e ? e.closest(sel) : null; };

  // if an older tabs block already ran, unwrap its panels first
  document.querySelectorAll('.tabpanel').forEach(p => p.replaceWith(...p.childNodes));

  const ICONS = {
    overview: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
    live: '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    community: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.9.8 3 2.5 3 5.6"/></svg>',
    staff: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/></svg>',
  };
  const TABS = [
    { id: 'overview',  label: 'Overview',  parts: [q('overview'), up('chart', '.card'), up('teams', '.two'), up('wanted', '.two'), up('calls', '.two'), q('heatCard')] },
    { id: 'live',      label: 'Live',      parts: [q('mapSec'), q('playersSec'), q('vehSec')] },
    { id: 'community', label: 'Community', parts: [q('eventsSec'), q('verifyCard')] },
    { id: 'staff',     label: 'Staff',     parts: [q('staffCard'), q('adminCard')] },
  ];

  // move the logo and server name into the sidebar
  const brand = document.querySelector('header .brand');
  nav.textContent = '';
  if (brand) nav.append(brand);
  const label = document.createElement('div'); label.className = 'side-label'; label.textContent = 'Dashboard'; nav.append(label);

  const panels = {}, links = {};
  let after = q('banner') || nav;
  for (const t of TABS) {
    const panel = document.createElement('div');
    panel.className = 'tabpanel'; panel.id = 'tab-' + t.id; panel.hidden = true;
    for (const part of t.parts) if (part) panel.append(part);
    after.after(panel); after = panel; panels[t.id] = panel;

    const a = document.createElement('a');
    a.href = '#tab-' + t.id;
    a.insertAdjacentHTML('afterbegin', ICONS[t.id]);
    const span = document.createElement('span'); span.textContent = t.label; a.append(span);
    a.addEventListener('click', e => { e.preventDefault(); show(t.id, true); });
    nav.append(a); links[t.id] = a;
  }

  function show(id, toTop) {
    if (!panels[id]) id = 'overview';
    for (const k of Object.keys(panels)) {
      panels[k].hidden = k !== id;
      links[k].classList.toggle('on', k === id);
      if (k === id) links[k].setAttribute('aria-current', 'page'); else links[k].removeAttribute('aria-current');
    }
    try { history.replaceState(null, '', '#tab-' + id); } catch {}
    if (toTop) window.scrollTo({ top: 0 });
  }

  const h = location.hash.slice(1);
  let start = h.startsWith('tab-') ? h.slice(4) : null;
  if (!start && h) { const e = q(h), p = e && e.closest('.tabpanel'); if (p) start = p.id.slice(4); }
  show(start || 'overview');
  if (h && !h.startsWith('tab-') && q(h)) q(h).scrollIntoView();

  // hide the Staff item when this person has neither the staff panel nor the admin panel
  const sync = () => {
    const gone = id => !q(id) || q(id).hidden;
    const none = gone('staffCard') && gone('adminCard');
    links.staff.hidden = none;
    if (none && !panels.staff.hidden) show('overview');
  };
  sync();
  const mo = new MutationObserver(sync);
  for (const id of ['staffCard', 'adminCard']) if (q(id)) mo.observe(q(id), { attributes: true, attributeFilter: ['hidden'] });
})();
</script>
